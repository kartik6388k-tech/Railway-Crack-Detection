<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRACKSCAN — Rail Defect Detection</title>
<meta name="description" content="Upload a rail image to scan for wheel cracks and rail gaps using YOLO-based detection.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="app-shell">

  <!-- Top bar -->
  <header class="topbar">
    <span class="topbar__spacer" aria-hidden="true"></span>
    <div class="topbar__brand">
      <span class="topbar__mark" aria-hidden="true"></span>
      <div class="topbar__text">
        <p class="topbar__title">TRACKSCAN</p>
        <p class="topbar__subtitle">Rail wheel crack &amp; gap detection</p>
      </div>
    </div>
    <button type="button" id="settingsToggle" class="icon-btn" aria-expanded="false" aria-controls="settingsPanel" aria-label="Scan settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.92 2.92l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2.06 2.06 0 1 1-4.12 0v-.09A1.7 1.7 0 0 0 8.77 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.92-2.92l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H2.6a2.06 2.06 0 1 1 0-4.12h.09A1.7 1.7 0 0 0 4.3 8.77a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.92-2.92l.06.06a1.7 1.7 0 0 0 1.87.34H8.8A1.7 1.7 0 0 0 9.83 2.7V2.6a2.06 2.06 0 1 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.92 2.92l-.06.06a1.7 1.7 0 0 0-.34 1.87V8.8c.14.65.6 1.18 1.24 1.42h.1a2.06 2.06 0 1 1 0 4.12h-.09a1.7 1.7 0 0 0-1.56 1.03Z"></path>
      </svg>
    </button>
  </header>

  <!-- Advanced settings (collapsed by default) -->
  <section id="settingsPanel" class="settings-panel" hidden>
    <p class="settings-panel__label">Scan settings</p>
    <div class="settings-grid">
      <label class="field">
        <span class="field__label">Confidence <span id="confVal" class="field__value">0.10</span></span>
        <input type="range" id="confInput" min="0" max="1" step="0.01" value="0.10">
      </label>
      <label class="field">
        <span class="field__label">IoU <span id="iouVal" class="field__value">0.45</span></span>
        <input type="range" id="iouInput" min="0" max="1" step="0.01" value="0.45">
      </label>
      <label class="field">
        <span class="field__label">Image size</span>
        <input type="number" id="imgszInput" min="320" max="1920" step="32" value="960">
      </label>
      <label class="field">
        <span class="field__label">Max detections</span>
        <input type="number" id="maxDetInput" min="1" max="300" step="1" value="100">
      </label>
      <label class="field field--wide">
        <span class="field__label">Device</span>
        <select id="deviceInput">
          <option value="">Auto</option>
          <option value="cpu">CPU</option>
          <option value="0">GPU 0</option>
        </select>
      </label>
    </div>
  </section>

  <main class="main">

    <!-- Error banner -->
    <div id="errorBanner" class="error-banner" role="alert" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path></svg>
      <span id="errorMessage">Scan failed.</span>
    </div>

    <div class="layout-grid">

      <!-- Scan column: upload / preview -->
      <section class="scan-column">
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Select a rail image to scan">
          <div id="dropzoneEmpty" class="dropzone__empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="30" height="30"><path d="M12 16V4M12 4 7 9M12 4l5 5"></path><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
            <p class="dropzone__title">Drop a rail image, or tap to select</p>
            <p class="dropzone__hint">JPG · PNG · WEBP</p>
          </div>

          <div id="previewWrap" class="preview-wrap" hidden>
            <img id="previewImg" alt="Selected rail image">
            <div id="scanline" class="scanline" aria-hidden="true"></div>
            <span id="previewFilename" class="preview-filename"></span>
          </div>
        </div>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" capture="environment" hidden>
      </section>

      <!-- Results column: status + detections -->
      <section class="results-column">
        <!-- Status band -->
        <div id="statusBand" class="status-band" role="status" aria-live="polite" hidden>
          <span id="statusIcon" class="status-band__icon" aria-hidden="true"></span>
          <div>
            <p id="statusTitle" class="status-band__title">—</p>
            <p id="statusSubtitle" class="status-band__subtitle"></p>
          </div>
        </div>

        <!-- Detections list -->
        <ul id="detectionsList" class="detections" hidden></ul>

        <!-- Empty state, shown until the first scan -->
        <p id="resultsPlaceholder" class="results-placeholder">Results will appear here after a scan.</p>
      </section>

    </div>
  </main>

  <!-- Action bar: fixed to thumb reach on phone, inline on desktop -->
  <div class="action-bar">
    <button type="button" id="resetBtn" class="btn btn--ghost" disabled>New scan</button>
    <button type="button" id="scanBtn" class="btn btn--primary" disabled>Scan for defects</button>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <p>Made by — Kartik Kushwaha</p>
  </footer>

</div>

<script src="/static/js/script.js"></script>
</body>
</html>
